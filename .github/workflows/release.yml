name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (e.g. v0.1.0)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Build + release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Garden ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Unsigned macOS build.

            Apple Silicon and Intel binaries are bundled as a universal `.dmg`.

            **First launch:** macOS blocks unsigned apps. Right-click the app → Open, or run
            `xattr -dr com.apple.quarantine /Applications/Garden.app` after moving it to Applications.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin --bundles app,dmg
