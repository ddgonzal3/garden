name: Garden
options:
  bundleIdPrefix: com.danny.garden
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Garden:
    type: application
    platform: macOS
    sources:
      - Garden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danny.garden
        PRODUCT_NAME: Garden
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_ENTITLEMENTS: Garden/Garden.entitlements
        CODE_SIGN_STYLE: Automatic
  GardenUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - GardenUITests
    dependencies:
      - target: Garden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danny.garden.uitests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
